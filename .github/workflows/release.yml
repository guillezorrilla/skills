name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # Opens (or updates) a version PR collecting pending changesets. Merging it
      # bumps package.json, regenerates CHANGELOG.md, syncs plugin.json's version,
      # and tags — which is what makes plugin subscribers see the update.
      - name: Create version pull request
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npx changeset tag
          commit: "chore: version skills"
          title: "chore: version skills"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Anyone installing through the Claude apps installs by uploading a file, so
      # the zips have to live somewhere a non-engineer can click. Release assets
      # are that somewhere — see docs/install-in-the-claude-app.md.
      - name: Attach the Claude app pack to the release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run pack
          tag="v$(node -p "require('./package.json').version")"
          gh release create "$tag" dist/claude-app/*.zip --title "$tag" --generate-notes \
            || gh release upload "$tag" dist/claude-app/*.zip --clobber
