name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # Opens (or updates) a version PR collecting pending changesets. Merging it
      # bumps package.json, regenerates CHANGELOG.md, syncs plugin.json's version,
      # and tags — which is what makes plugin subscribers see the update.
      - name: Create version pull request
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npx changeset tag
          commit: "chore: version skills"
          title: "chore: version skills"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
